apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: microservices-demo-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "microservices-demo"
      commonUpdateSettings:
        updateStrategy: newest-build
        allowTags: "regexp:^sha-[a-f0-9]{7}$"
      images:
        - alias: frontend
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/frontend"
        - alias: cartservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/cartservice"
        - alias: checkoutservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/checkoutservice"
        - alias: currencyservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/currencyservice"
        - alias: emailservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/emailservice"
        - alias: paymentservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/paymentservice"
        - alias: productcatalogservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/productcatalogservice"
        - alias: recommendationservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/recommendationservice"
        - alias: shippingservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/shippingservice"
        - alias: adservice
          imageName: "ghcr.io/ibtisam-iq/microservices-demo/adservice"
