# HTTPRoute — exposes Prometheus through the shared ALB Gateway
# Hostname: prometheus.ibtisam.qzz.io
# Backend:  kube-prometheus-stack-prometheus Service (port 9090)
#           Created by the kube-prometheus-stack Helm chart.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
spec:
  hostnames:
    - "prometheus.ibtisam.qzz.io"
  parentRefs:
    - group: gateway.networking.k8s.io
      namespace: default
      kind: Gateway
      name: app-alb-gateway
      sectionName: http
    - group: gateway.networking.k8s.io
      namespace: default
      kind: Gateway
      name: app-alb-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
