# Helm values patch for eck-kibana chart
# Release name: eck-kibana
# Chart: elastic/eck-kibana
# Namespace: logging
#
# Apply with:
#   helm install eck-kibana elastic/eck-kibana \
#     --version 0.18.0 -f patch-values-kibana.yaml -n logging

# Reference to the Elasticsearch cluster managed by ECK.
elasticsearchRef:
  name: eck-elasticsearch  # CR name from eck-elasticsearch chart
  namespace: logging
