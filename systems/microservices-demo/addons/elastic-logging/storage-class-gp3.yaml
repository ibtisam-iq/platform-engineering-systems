# StorageClass — gp3 EBS volumes for Elasticsearch PersistentVolumeClaims
#
# Elasticsearch requires a default StorageClass backed by the EBS CSI driver.
# gp3 is preferred over gp2 for better baseline performance and lower cost.
#
# Apply with:
#   kubectl apply -f storage-class-gp3.yaml
#
# Then remove the default annotation from gp2 (if it was the previous default):
#   kubectl patch storageclass gp2 -p \
#     '{"metadata": {"annotations": {"storageclass.kubernetes.io/is-default-class": "false"}}}'
#
# Verify:
#   kubectl get storageclass
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
