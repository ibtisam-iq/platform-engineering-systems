# ---------------------------------------------------------------
# values-eks.yaml
# EKS patch on top of the upstream values.yaml
# Only fields that differ from upstream defaults are listed here.
#
# Chart:   oci://ghcr.io/ibtisam-iq/onlineboutique
# Cluster: Amazon EKS
# Ingress: Gateway API HTTPRoute + AWS ALB (defined in manifests/)
# ---------------------------------------------------------------

images:
  repository: ghcr.io/ibtisam-iq/microservices-demo
  # Set to "latest" for initial deployment. ArgoCD Image Updater
  # tracks this tag's digest in GHCR and rolls pods automatically
  # when CI pushes a new image. The tag value here is only used
  # for the first deploy; Image Updater manages it from there.
  tag: "latest"

frontend:
  # Suppress the default LoadBalancer Service. Traffic enters via
  # HTTPRoute + ALB TargetGroupBinding in manifests/.
  externalService: false
  platform: aws

# loadgenerator is excluded from the CI matrix (not a production
# service, no image pushed to GHCR). Deploying it would cause
# ImagePullBackOff. Disable it here.
loadGenerator:
  create: false
