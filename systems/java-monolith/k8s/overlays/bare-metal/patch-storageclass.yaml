# Patches mysql-pvc to use the bare-metal StorageClass.
# Provisioner setup and class options: https://runbook.ibtisam-iq.com/bootstrap/kubernetes/deploy-local-path-provisioner/

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: bankapp
spec:
  storageClassName: local-path
