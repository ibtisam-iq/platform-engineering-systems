# k8s/overlays/eks/kustomization.yaml
# AWS EKS Overlay

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bankapp

resources:
  - ../../base
  - storageclass-gp3.yaml
  - gateway.yaml
  - httproute.yaml
  - hpa.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      metadata:
        name: bankapp
      spec:
        replicas: 2
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bankapp-config
      data:
        SPRING_DATASOURCE_URL: "jdbc:mysql://<rds-endpoint>:3306/IbtisamIQbankappdb?useSSL=true&requireSSL=true&serverTimezone=UTC"
  - path: patch-storageclass.yaml
    target:
      kind: PersistentVolumeClaim
      name: mysql-pvc
  - target:
      kind: LoadBalancerConfiguration
      name: bankapp-gw-lbconfig
    patch: |-
      - op: replace
        path: /spec/listenerConfigurations/0/defaultCertificate
        value: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"

images:
  - name: mibtisam/java-monolith
    newName: mibtisam/java-monolith
    newTag: latest

labels:
  - pairs:
      environment: eks
    includeSelectors: true
    includeTemplates: true
