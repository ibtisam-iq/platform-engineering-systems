# k8s/overlays/eks/kustomization.yaml
# ============================================================
# Overlay — EKS HTTP (dev / staging, no TLS)
# Purpose: AWS EKS deployment without HTTPS.
#
# What this overlay does differently from base:
#   1. Adds Gateway with AWS ALB annotations.
#   2. Patches mysql-pvc StorageClass to gp3 (AWS EBS).
#   3. App service stays ClusterIP — ALB Gateway routes externally.
#
# Deploy:  kubectl apply -k overlays/eks/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bankapp

resources:
  - ../../base          # pull in all 9 base files
  - gateway.yaml
  - httproute.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      metadata:
        name: bankapp
      spec:
        replicas: 2  # scale up for EKS (HA across AZs)
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bankapp-config
      data:
        # Override datasource URL for RDS (replace host + add SSL params)
        SPRING_DATASOURCE_URL: "jdbc:mysql://<rds-endpoint>:3306/IbtisamIQbankappdb?useSSL=true&requireSSL=true&serverTimezone=UTC"
  - path: patch-storageclass.yaml
    target:
      kind: PersistentVolumeClaim
      name: mysql-pvc


images:
  - name: mibtisam/java-monolith
    newName: mibtisam/java-monolith
    newTag: latest                        # CI overrides this via image.env

labels:
  - pairs:
      environment: eks
    includeSelectors: true
    includeTemplates: true
