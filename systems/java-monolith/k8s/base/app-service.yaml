# k8s/base/app-service.yaml
# ClusterIP Service for Spring Boot BankApp
# Managed by: Kustomize

apiVersion: v1
kind: Service
metadata:
  name: bankapp-service
  namespace: bankapp
  labels:
    app.kubernetes.io/name: bankapp
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: java-monolith
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bankapp
    app.kubernetes.io/component: application
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
