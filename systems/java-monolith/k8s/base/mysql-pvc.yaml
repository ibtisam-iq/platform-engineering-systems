# k8s/base/mysql-pvc.yaml
# PersistentVolumeClaim for MySQL Data.
# Managed by: Kustomize

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: bankapp
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: java-monolith
    app.kubernetes.io/managed-by: kustomize
  annotations:
    storage/purpose: "MySQL 8.4 data directory — IbtisamIQbankappdb"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName is intentionally omitted to use cluster defaults.
  # Overlays patch this field for specific backends.
